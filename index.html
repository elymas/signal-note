<html lang="ko">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1411" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="공개 릴스와 YouTube 영상을 전수 확인하고, 주장·규칙·검증 한계를 분리한 SIGNAL NOTE 영상 리서치 아카이브." />

    <meta property="og:type" content="website" />

    <meta property="og:description" content="릴스와 유튜브 트레이딩 영상을 전수 분석해 주장·실행 규칙·검증 한계를 분리한 영상 증거 아카이브." />

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>SIGNAL NOTE RESEARCH — Video Evidence Archive</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sn-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
